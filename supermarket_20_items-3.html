<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Super Market - 20 Items</title>
<style>
body{font-family:Arial,sans-serif;margin:0;background:#f5f6fa;color:#222}
header{background:#198754;color:white;text-align:center;padding:22px}
.container{max-width:1100px;margin:25px auto;padding:0 15px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px}
.card{background:white;border-radius:12px;padding:15px;box-shadow:0 3px 10px #0001;text-align:center}
.card img{width:100%;height:160px;object-fit:cover;border-radius:8px}
.card h3{margin:12px 0 6px}
.price{font-weight:bold;color:#198754;font-size:18px}
button{background:#198754;color:white;border:0;padding:10px 18px;border-radius:6px;cursor:pointer}
button:hover{background:#146c43}
#cart{margin:20px 0;padding:15px;background:white;border-radius:10px}
</style>
</head>
<body>
<header><h1>🛒 Super Market</h1><p>20 Daily Grocery Items</p></header>
<div class="container">
<div id="cart"><strong>Cart: <span id="count">0</span> items</strong> | Total: ₹<span id="total">0</span></div>
<div class="grid" id="products"></div>
</div>
<script>
const items = [
["Rice","₹60/kg","https://images.unsplash.com/photo-1586201375761-83865001e31c?w=500"],
["Wheat Flour","₹50/kg","https://images.unsplash.com/photo-1627485937980-221c88ac04f9?w=500"],
["Sugar","₹45/kg","https://images.unsplash.com/photo-1581441363689-1f3c3c414635?w=500"],
["Cooking Oil","₹140/L","https://images.unsplash.com/photo-1474979266404-7eaacbcd87c5?w=500"],
["Milk","₹60/L","https://images.unsplash.com/photo-1563636619-e9143da7973b?w=500"],
["Bread","₹40","https://images.unsplash.com/photo-1509440159596-0249088772ff?w=500"],
["Eggs","₹72 / 12","https://images.unsplash.com/photo-1582722872445-44dc5f7e3c8f?w=500"],
["Apples","₹160/kg","https://images.unsplash.com/photo-1560806887-1e4cd0b6cbd6?w=500"],
["Bananas","₹50/dozen","https://images.unsplash.com/photo-1571771894821-ce9b6c11b08e?w=500"],
["Tomatoes","₹40/kg","https://images.unsplash.com/photo-1546094096-0df4bcaaa337?w=500"],
["Potatoes","₹35/kg","https://images.unsplash.com/photo-1518977676601-b53f82aba655?w=500"],
["Onions","₹45/kg","https://images.unsplash.com/photo-1618512496248-a07fe83aa8cb?w=500"],
["Biscuits","₹30","https://images.unsplash.com/photo-1558961363-fa8fdf82db35?w=500"],
["Tea Powder","₹180 / pack","https://images.unsplash.com/photo-1594631252845-29fc4cc8cde9?w=500"],
["Coffee","₹220 / pack","https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?w=500"],
["Salt","₹25/kg","https://images.unsplash.com/photo-1518110925495-5fe2eae4df67?w=500"],
["Toothpaste","₹90","https://images.unsplash.com/photo-1559591937-e3a6e1c9a4a8?w=500"],
["Shampoo","₹150","https://images.unsplash.com/photo-1620916566398-39f1143ab7be?w=500"],
["Soap","₹45","https://images.unsplash.com/photo-1607006344380-b6775a0824d7?w=500"],
["Detergent","₹120","https://images.unsplash.com/photo-1626806787461-102c1bfaaea1?w=500"]
];

let count=0,total=0;
const products=document.getElementById("products");
items.forEach((item,i)=>{
  products.innerHTML += `<div class="card">
    <img src="${item[2]}" alt="${item[0]}">
    <h3>${i+1}. ${item[0]}</h3>
    <p class="price">${item[1]}</p>
    <button onclick="addItem('${item[0]}','${item[1]}')">Add to Cart</button>
  </div>`;
});
function addItem(name,price){
  count++;
  const value=parseInt(price.replace(/[^0-9]/g,''))||0;
  total+=value;
  document.getElementById("count").textContent=count;
  document.getElementById("total").textContent=total;
}
</script>
</body>
</html>
